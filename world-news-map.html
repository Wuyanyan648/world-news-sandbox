<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>寰宇战情 · 世界新闻沙盘</title>
<link rel="icon" type="image/svg+xml" href="desktop/icon.svg">
<style>
  :root{
    --bg:#071020; --panel:#0d1422; --panel2:#101a2c; --line:#26364f;
    --gold:#c9a227; --gold2:#e6c86a; --ink:#d8e0ee; --muted:#8fa0b8;
    --green:#2f9e7d; --red:#b91c1c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none}
  canvas#map{position:fixed;inset:0;display:block;cursor:grab;touch-action:none;z-index:2}
  canvas#map.dragging{cursor:grabbing}
  #baseLayer,#hlLayer{position:fixed;top:0;left:0;pointer-events:none;transform-origin:0 0;will-change:transform}
  #baseLayer{z-index:0}
  #hlLayer{z-index:1}
  #vigLayer{position:fixed;inset:0;pointer-events:none;z-index:3}
  canvas#fog{position:fixed;inset:0;display:block;pointer-events:none;z-index:5}

  /* ---------- 顶部栏 ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;
    padding:14px 22px 12px;background:linear-gradient(180deg,rgba(4,8,16,.92) 60%,rgba(4,8,16,0));
    pointer-events:none}
  #topbar>*{pointer-events:auto}
  .title-block h1{font-family:Georgia,"Songti SC","SimSun",serif;font-size:22px;letter-spacing:6px;
    color:var(--gold2);text-shadow:0 0 18px rgba(230,200,106,.35);font-weight:700}
  .title-block .sub{font-size:11.5px;letter-spacing:2px;color:var(--muted);margin-top:3px}
  #stats{font-size:11.5px;color:var(--muted);letter-spacing:1px;border-left:1px solid var(--line);padding-left:14px;line-height:1.5}
  #clock{display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:14px}
  #bjTime{font-family:"SF Mono",Consolas,monospace;font-size:13px;color:var(--gold2);letter-spacing:1px;white-space:nowrap}
  #clock .tz{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;text-align:center;margin-top:2px}
  #staleBadge{font-size:11px;color:#ffb4b4;background:rgba(185,28,28,.18);border:1px solid rgba(255,93,93,.5);
    padding:2px 9px;border-radius:999px;letter-spacing:1px;white-space:nowrap}
  #datePicker{background:rgba(16,26,44,.85);border:1px solid var(--line);color:var(--ink);font-size:12px;
    padding:7px 10px;border-radius:4px;color-scheme:dark;letter-spacing:1px}
  #datePicker:hover{border-color:var(--gold)}
  #calPop{position:fixed;top:126px;right:22px;z-index:35;width:268px;background:rgba(11,18,31,.98);
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 10px 36px rgba(0,0,0,.6)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  #calTitle{font-size:12.5px;color:var(--gold2);letter-spacing:2px}
  .cal-nav{background:none;border:1px solid var(--line);color:var(--ink);width:24px;height:24px;
    border-radius:4px;cursor:pointer;font-size:14px;line-height:1}
  .cal-nav:hover{border-color:var(--gold);color:var(--gold2)}
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-week span{font-size:10px;color:var(--muted);text-align:center;padding:2px 0}
  .cal-grid button{aspect-ratio:1;border-radius:4px;border:1px solid transparent;background:rgba(26,40,64,.45);
    color:var(--muted);font-size:11.5px;cursor:pointer;transition:.12s}
  .cal-grid button.have{background:rgba(201,162,39,.22);border-color:rgba(201,162,39,.55);color:var(--gold2)}
  .cal-grid button.have:hover{background:rgba(201,162,39,.4)}
  .cal-grid button.none{opacity:.45}
  .cal-grid button.none:hover{opacity:.8;border-color:var(--line)}
  .cal-grid button.today{box-shadow:inset 0 0 0 1px var(--gold2)}
  .cal-grid button.sel{background:var(--gold);color:#0b1220;font-weight:700}
  .cal-grid button:disabled{opacity:.18;cursor:default}
  .cal-foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10.5px;color:var(--muted)}
  .cal-foot .cd{width:9px;height:9px;border-radius:2px;display:inline-block;margin-left:8px}
  .cal-foot .cd.have{background:rgba(201,162,39,.7)}
  .cal-foot .cd.none{background:rgba(26,40,64,.9);border:1px solid var(--line)}
  .cal-foot .cd.today{box-shadow:inset 0 0 0 1px var(--gold2)}
  #mgrModal{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.65);display:flex;align-items:center;justify-content:center}
  #mgrCard{position:relative;width:540px;max-width:92vw;max-height:76vh;overflow:auto;background:rgba(13,20,34,.97);
    border:1px solid var(--line);border-radius:10px;padding:20px 22px;box-shadow:0 12px 50px rgba(0,0,0,.6)}
  #mgrCard h2{font-family:Georgia,"Songti SC",serif;font-size:17px;color:var(--gold2);letter-spacing:3px;margin-bottom:6px}
  #mgrCard .mgr-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .mgr-row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(38,54,79,.5);font-size:12.5px}
  .mgr-row .w-name{color:var(--ink);letter-spacing:1px}
  .mgr-row .w-meta{color:var(--muted);font-size:11px;margin-left:auto}
  .mgr-del{background:rgba(185,28,28,.15);border:1px solid rgba(255,93,93,.45);color:#ffb4b4;font-size:11px;
    padding:3px 10px;border-radius:4px;cursor:pointer}
  .mgr-del:hover{background:rgba(185,28,28,.35)}
  #updateBanner{position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(13,20,34,.95);border:1px solid var(--gold);border-radius:6px;padding:10px 20px;
    font-size:12.5px;color:var(--gold2);letter-spacing:1px;box-shadow:0 4px 24px rgba(0,0,0,.5);
    display:flex;align-items:center;gap:12px;max-width:90vw}
  #updateBanner .ub-close{cursor:pointer;color:var(--muted);font-size:15px;padding:0 2px}
  #updateBanner .ub-close:hover{color:var(--gold2)}
  #updateBanner[data-state="ok"]{border-color:var(--green);color:#7fe7c4}
  #updateBanner[data-state="waiting"]{border-color:var(--gold);color:var(--gold2)}
  #updateBanner[data-state="error"]{border-color:var(--red);color:#ffb4b4}
  #updateBanner[data-state="working"]::before{content:"";width:10px;height:10px;flex:none;
    border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:ubspin .8s linear infinite}
  @keyframes ubspin{to{transform:rotate(360deg)}}
  .spacer{flex:1}
  .btn{background:rgba(16,26,44,.85);border:1px solid var(--line);color:var(--ink);font-size:12.5px;
    letter-spacing:2px;padding:8px 16px;border-radius:4px;cursor:pointer;transition:.18s}
  .btn:hover{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 12px rgba(201,162,39,.25)}

  /* ---------- 日期筛选 ---------- */
  #chips{position:fixed;top:86px;left:22px;z-index:15;display:flex;gap:8px;flex-wrap:wrap;max-width:70vw}
  .chip{background:rgba(13,20,34,.94);border:1px solid var(--line);color:var(--muted);font-size:12px;
    padding:5px 13px;border-radius:999px;cursor:pointer;letter-spacing:1px;transition:.15s}
  .chip:hover{color:var(--ink);border-color:#3d5372}
  .chip.on{background:linear-gradient(135deg,rgba(201,162,39,.28),rgba(201,162,39,.1));
    color:var(--gold2);border-color:var(--gold);box-shadow:0 0 10px rgba(201,162,39,.2)}

  /* ---------- 图例 ---------- */
  #legend{position:fixed;left:22px;bottom:44px;z-index:15;background:rgba(10,16,28,.95);border:1px solid var(--line);
    border-radius:8px;padding:12px 14px}
  #legend .lg-title{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
  .lg-item{display:flex;align-items:center;gap:9px;padding:4px 2px;cursor:pointer;font-size:12.5px;color:var(--ink)}
  .lg-item .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .lg-item .cnt{margin-left:auto;font-size:11px;color:var(--muted);min-width:16px;text-align:right}
  .lg-item.off{opacity:.35}
  .lg-item.off .cnt{color:var(--muted)}

  /* ---------- 新闻卷轴（左侧抽屉） ---------- */
  #drawer{position:fixed;top:0;bottom:0;left:0;width:320px;z-index:25;background:rgba(9,14,24,.985);
    border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .3s ease;display:flex;flex-direction:column}
  #drawer.open{transform:translateX(0)}
  #drawer .dr-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  #drawer .dr-head h2{font-family:Georgia,"Songti SC",serif;font-size:16px;letter-spacing:4px;color:var(--gold2)}
  #drawer .dr-head p{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px}
  #drawer .dr-list{flex:1;overflow-y:auto;padding:10px 8px}
  .dr-row{display:flex;gap:10px;align-items:flex-start;padding:10px 10px;border-radius:6px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .dr-row:hover{background:rgba(26,40,64,.55);border-color:var(--line)}
  .dr-row .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;box-shadow:0 0 8px currentColor}
  .dr-row .r-title{font-size:13px;color:var(--ink);line-height:1.4}
  .dr-row .r-sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1px}

  /* ---------- 详情面板（右侧） ---------- */
  #panel{position:fixed;top:0;bottom:0;right:0;width:400px;max-width:94vw;z-index:25;background:rgba(9,14,24,.985);
    border-left:1px solid var(--line);transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column}
  #panel.open{transform:translateX(0)}
  .pn-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
  .pn-head::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--catc,#c9a227);
    box-shadow:0 0 14px var(--catc,#c9a227)}
  .pn-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
  .pn-meta .cdot{width:8px;height:8px;border-radius:50%;background:var(--catc,#c9a227);box-shadow:0 0 8px var(--catc)}
  .pn-meta .cdate{margin-left:auto;color:var(--gold2)}
  .pn-head h2{font-family:Georgia,"Songti SC",serif;font-size:19px;color:#f0f4fb;letter-spacing:1px;line-height:1.4}
  .pn-body{flex:1;overflow-y:auto;padding:16px 22px 26px}
  .pn-sec{margin-bottom:18px}
  .pn-sec .s-title{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
  .pn-sum{font-size:13.5px;line-height:1.9;color:#c3cede}
  .tagrow{display:flex;flex-wrap:wrap;gap:7px}
  .tag{font-size:12px;padding:4px 11px;border-radius:4px;background:rgba(26,40,64,.6);border:1px solid var(--line);color:var(--ink)}
  .tag.loc{border-color:rgba(201,162,39,.45);color:var(--gold2)}
  .pn-links a{display:block;font-size:12.5px;color:#6ea8ff;text-decoration:none;padding:4px 0;border-bottom:1px dashed rgba(38,54,79,.6)}
  .pn-links a:hover{color:#a9cbff}
  .rel-btn{display:block;width:100%;text-align:left;font-size:12.5px;padding:8px 12px;margin-top:6px;cursor:pointer;
    background:rgba(16,26,44,.8);border:1px solid var(--line);border-radius:4px;color:var(--ink);transition:.15s}
  .rel-btn:hover{border-color:var(--gold);color:var(--gold2)}
  .pn-close{position:absolute;top:16px;right:16px;width:28px;height:28px;line-height:26px;text-align:center;
    font-size:16px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:4px;transition:.15s}
  .pn-close:hover{color:var(--gold2);border-color:var(--gold)}

  /* ---------- tooltip ---------- */
  #tooltip{position:fixed;z-index:40;background:rgba(10,16,28,.94);border:1px solid var(--line);border-left:3px solid var(--gold);
    padding:9px 13px;border-radius:4px;pointer-events:none;font-size:12px;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tooltip .t-title{color:var(--gold2);letter-spacing:1px;margin-bottom:3px}
  #tooltip .t-sub{color:var(--muted);font-size:11px}
  .hidden{display:none!important}

  /* ---------- 底部提示 ---------- */
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:15;font-size:11px;letter-spacing:2px;
    color:rgba(143,160,184,.7);background:rgba(5,8,15,.6);padding:6px 18px;border-radius:999px;border:1px solid rgba(38,54,79,.7)}

  /* ---------- 启动画面 ---------- */
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#0c1526 0%,#04070d 75%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash h1{font-family:Georgia,"Songti SC",serif;font-size:34px;letter-spacing:14px;color:var(--gold2);
    text-shadow:0 0 30px rgba(230,200,106,.5);animation:breath 2.2s ease-in-out infinite}
  #splash .line{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0 12px}
  #splash p{font-size:12px;letter-spacing:5px;color:var(--muted)}
  @keyframes breath{0%,100%{opacity:.85}50%{opacity:1;text-shadow:0 0 40px rgba(230,200,106,.8)}}

  /* ================= 战情室主题（钢铁雄心式） ================= */
  :root{
    --bg:#08100e;
    --panel:#11140e; --panel2:#171a12; --line:#3b3a2a;
    --gold:#b98f3e; --gold2:#e3c47a; --brass:#a9853f;
    --ink:#ded6c0; --muted:#9a947e;
    --green:#5e8c5a; --red:#9e4636;
    --serif:Georgia,"Songti SC","SimSun",serif;
  }
  html,body{background:var(--bg)}
  #topbar{padding:12px 24px 11px;
    background:linear-gradient(180deg,rgba(4,7,5,.96) 62%,rgba(4,7,5,0))}
  #topbar::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(201,162,39,.42) 18%,rgba(201,162,39,.42) 82%,transparent)}
  .title-block{position:relative;padding-left:14px}
  .title-block::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;
    background:linear-gradient(180deg,rgba(227,196,122,0),rgba(227,196,122,.85),rgba(227,196,122,0))}
  .title-block h1{font-size:23px;letter-spacing:8px;color:#e9d1a0;
    text-shadow:0 1px 0 rgba(0,0,0,.9),0 0 22px rgba(201,162,39,.28)}
  .title-block .sub{color:#9d947c;letter-spacing:2.5px}
  #stats{color:#9d947c;border-left-color:rgba(150,125,66,.35)}
  #clock{border-left-color:rgba(150,125,66,.35)}
  #bjTime{color:#e3c47a}
  .btn{background:linear-gradient(180deg,rgba(38,40,30,.96),rgba(19,21,15,.96));
    border:1px solid rgba(158,128,66,.45); color:#d8cfb6;
    font-family:var(--serif); letter-spacing:2.5px;
    box-shadow:inset 0 1px 0 rgba(255,240,190,.07),0 2px 8px rgba(0,0,0,.42)}
  .btn:hover{border-color:rgba(226,196,122,.8);color:#f1e2b8;
    box-shadow:inset 0 1px 0 rgba(255,240,190,.12),0 0 16px rgba(185,143,62,.28)}
  .chip{background:linear-gradient(180deg,rgba(32,34,26,.95),rgba(16,18,13,.95));
    border:1px solid rgba(148,120,62,.34); color:#a39b83;
    font-family:var(--serif); letter-spacing:2px}
  .chip:hover{color:#ded5bd;border-color:rgba(185,143,62,.6)}
  .chip.on{background:linear-gradient(180deg,rgba(150,118,52,.42),rgba(84,66,30,.32));
    border-color:rgba(226,196,122,.75); color:#f2e3b8;
    box-shadow:inset 0 1px 0 rgba(255,240,190,.16),0 0 14px rgba(185,143,62,.22)}
  #legend,#drawer,#panel,#mgrCard,#tooltip,#calPop,#updateBanner{
    background:linear-gradient(180deg,rgba(18,21,15,.975),rgba(10,12,8,.975));
    border:1px solid rgba(158,130,70,.4);
    box-shadow:0 12px 44px rgba(0,0,0,.62),inset 0 0 0 1px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,240,190,.05)}
  #legend .lg-title,.pn-sec .s-title,#mgrCard .mgr-sub,#drawer .dr-head p{color:#9d947c;letter-spacing:3px}
  #mgrCard h2,#drawer .dr-head h2,#calTitle{color:#e3c47a;font-family:var(--serif)}
  .pn-head h2{font-family:var(--serif);color:#f3ead2}
  .pn-sum{color:#cfc6ae}
  .pn-links a{color:#c9a75e}
  .pn-links a:hover{color:#efd89e}
  .dr-row .r-title{color:#ded6c0}
  .dr-row:hover{background:rgba(48,44,30,.5);border-color:rgba(158,130,70,.35)}
  .tag{background:rgba(40,38,26,.7);border-color:rgba(140,120,70,.35);color:#d8cfb6}
  #tooltip .t-title{color:#e3c47a;font-family:var(--serif)}
  #updateBanner[data-state="ok"]{border-color:rgba(110,160,110,.55);color:#b9d8ad}
  #updateBanner[data-state="error"]{border-color:rgba(180,90,70,.6);color:#e6b1a4}
  #hint{background:rgba(8,10,7,.72);border-color:rgba(158,130,70,.35);color:#9d947c}
  .cal-grid button{background:rgba(34,34,24,.5);color:#9d947c}
  .cal-grid button.have{background:rgba(185,143,62,.2);border-color:rgba(214,178,94,.55);color:#e3c47a}
  .cal-grid button.sel{background:#b98f3e;color:#141208}
  #splash{background:radial-gradient(ellipse at center,#12170f 0%,#050705 75%)}
  #frame{position:fixed;inset:10px;z-index:12;pointer-events:none;
    border:1px solid rgba(190,155,85,.24);
    box-shadow:inset 0 0 110px rgba(0,0,0,.52),inset 0 0 0 1px rgba(0,0,0,.3)}
  #frame i{position:absolute;width:24px;height:24px;border:0 solid rgba(220,184,100,.65)}
  #frame i:nth-child(1){top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
  #frame i:nth-child(2){top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
  #frame i:nth-child(3){bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
  #frame i:nth-child(4){bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
  #compass{position:fixed;right:30px;bottom:58px;width:112px;height:112px;z-index:14;
    opacity:.42;pointer-events:none}
</style>
</head>
<body>

<img id="baseLayer" alt="">
<canvas id="hlLayer"></canvas>
<canvas id="map"></canvas>
<canvas id="vigLayer"></canvas>
<canvas id="fog"></canvas>

<div id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<svg id="compass" viewBox="0 0 120 120" aria-hidden="true">
  <g fill="none" stroke="#d6b25e" stroke-width="1">
    <circle cx="60" cy="60" r="44" opacity=".5"/>
    <circle cx="60" cy="60" r="35" opacity=".22"/>
    <path d="M60 8 L67 54 L60 60 L53 54 Z" fill="#d6b25e" stroke="none" opacity=".8"/>
    <path d="M60 112 L53 66 L60 60 L67 66 Z" fill="#d6b25e" stroke="none" opacity=".32"/>
    <path d="M8 60 L54 53 L60 60 L54 67 Z" fill="#d6b25e" stroke="none" opacity=".32"/>
    <path d="M112 60 L66 67 L60 60 L66 53 Z" fill="#d6b25e" stroke="none" opacity=".32"/>
  </g>
  <text x="60" y="22" text-anchor="middle" fill="#e3c47a" font-size="9"
        font-family="Georgia,serif" opacity=".85">N</text>
</svg>

<div id="splash">
  <h1>寰宇战情</h1>
  <div class="line"></div>
  <p>世界新闻沙盘 · 正在铺开地图</p>
</div>

<header id="topbar">
  <div class="title-block">
    <h1>寰宇战情</h1>
    <div class="sub">世界新闻沙盘 · 2026.11.11 — 11.18</div>
  </div>
  <div id="stats"></div>
  <div id="clock">
    <div><span id="bjTime">--</span><span class="tz">北京时间</span></div>
    <span id="staleBadge" class="hidden">数据过期</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnList">新闻卷轴</button>
  <input type="date" id="datePicker" class="hidden">
  <button class="btn" id="btnDate" title="选择日期（金色=有数据，灰色=无数据）">--</button>

/* ================= 工具函数 ================= */
function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
const lerp = (a,b,t)=>a+(b-a)*t;
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= 地图要素构建 ================= */
/* 把跨越 ±180° 经线的环拆成连续段，段首尾在 ±180 边界闭合，避免渲染横穿全图的线 */
function splitRing(ring){
  const n = ring.length;
  const segs = [];
  let cur = [];
  let side = ring[0][0] >= 0 ? 1 : 0;
  for (let i = 0; i < n; i++){
    const pt = ring[i];
    if (cur.length){
      const prev = ring[i-1];
      if (Math.abs(pt[0] - prev[0]) > 180){
        cur.push([side ? 180 : -180, prev[1]]);
        if (cur.length >= 3) segs.push(cur);
        cur = [];
        side = pt[0] >= 0 ? 1 : 0;
      }
    }
    cur.push([pt[0], pt[1]]);
  }
  const first = ring[0], last = ring[n-1];
  if (Math.abs(last[0] - first[0]) > 180){
    cur.push([side ? 180 : -180, last[1]]);
  } else {
    cur.push([first[0], first[1]]);
  }
  if (cur.length >= 3) segs.push(cur);
  return segs;
}

/* 世界几何数据在 world-geo.js 中异步加载；在地图已经显示后再建立索引，
   这样启动时不会被 2MB 的边界数据阻塞。索引就绪前国家悬停/高亮自动禁用。 */
const features = [];
let worldReady = false;

function buildWorldIndex(){
  if (worldReady || typeof WORLD_GEO === 'undefined') return;
  features.length = 0;
  for (const f of WORLD_GEO.features){
    const path = new Path2D(), hlPath = new Path2D();
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    const g = f.geometry; if(!g) continue;
    const polys = g.type==='Polygon' ? [g.coordinates] : g.coordinates;
    let hasPoly = false;
    for (const poly of polys) for (const ring of poly){
      if (ring.length < 3) continue;
      hasPoly = true;
      for (const seg of splitRing(ring)){
        seg.forEach((pt,i)=>{
          const [x,y] = P(pt[0],pt[1]);
          const [hx,hy] = PH(pt[0],pt[1]);
          if(i===0){ path.moveTo(x,y); hlPath.moveTo(hx,hy); }
          else { path.lineTo(x,y); hlPath.lineTo(hx,hy); }
          if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        });
        path.closePath(); hlPath.closePath();
      }
    }
    if (hasPoly) features.push({name:f.properties.name, path, hlPath, bbox:[minX,minY,maxX,maxY]});
  }
  /* 每国外环点集用于命中测试 */
  const rawByName = {};
  for (const f of WORLD_GEO.features){
    const g = f.geometry; if(!g) continue;
    const polys = g.type==='Polygon' ? [g.coordinates] : g.coordinates;
    const rings = [];
    for (const poly of polys){
      for (const seg of splitRing(poly[0])){
        rings.push(seg.map(pt=>P(pt[0],pt[1])));
      }
    }
    rawByName[f.properties.name] = rings;
  }
  for (const f of features) f._pts = rawByName[f.name] || [];
  worldReady = true;
  if (typeof __boot === 'object') __boot.world = performance.now();
  if (needBake) bakeBase();
}

let worldLoading = false;
function loadWorldGeo(){
  if (worldReady || worldLoading) return;
  worldLoading = true;
  const s = document.createElement('script');
  s.src = 'world-geo.js?v=1';
  s.async = true;
  s.onload = () => { try { buildWorldIndex(); } catch (e) { console.error(e); } };
  s.onerror = () => { console.warn('world-geo.js 加载失败：国家悬停/高亮不可用'); };
  document.head.appendChild(s);
}

/* ---------- 底图预渲染（DOM 层，GPU 合成） ---------- */
const base = document.getElementById('baseLayer');
/* 底图直接加载预烘焙的 JPEG，启动时不再重画 177 个国家路径。
   只有缓存缺失时才回退到运行时烘焙（需要先加载 world-geo.js）。 */
const BASE_IMG = 'assets/map-base.jpg?v=1';
let baseReady = false, needBake = false;

function onBaseReady(){
  if (baseReady) return;
  baseReady = true;
  if (typeof __boot === 'object') __boot.base = performance.now();
  hideSplashSoon();
  notifyShellReady();
  setTimeout(loadWorldGeo, 150);   // 底图显示后再加载国家边界，避免抢启动资源
}
base.onload = onBaseReady;
base.onerror = () => {
  console.warn('底图缓存缺失，回退到运行时烘焙');
  needBake = true;
  loadWorldGeo();
};
base.src = BASE_IMG;

function bakeBase(){
  const cv = document.createElement('canvas');
  cv.width = MAPW; cv.height = MAPH;
  const c = cv.getContext('2d');

  /* —— 海洋：深青灰 + 中央微光，模仿战情室地图的深水 —— */
  const oc = c.createLinearGradient(0,0,0,MAPH);
  oc.addColorStop(0,'#0a171c');
  oc.addColorStop(0.5,'#0a1a20');
  oc.addColorStop(1,'#061116');
  c.fillStyle = oc; c.fillRect(0,0,MAPW,MAPH);
  const seaGlow = c.createRadialGradient(MAPW*0.52, MAPH*0.42, 0, MAPW*0.52, MAPH*0.42, MAPW*0.62);
  seaGlow.addColorStop(0,'rgba(90,145,145,0.10)');
  seaGlow.addColorStop(0.55,'rgba(45,85,90,0.05)');
  seaGlow.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = seaGlow; c.fillRect(0,0,MAPW,MAPH);

  /* 经纬网（航海图式细线） */
  c.strokeStyle = 'rgba(155,185,170,0.055)'; c.lineWidth = 1;
  for(let lng=-180;lng<=180;lng+=30){ const [x]=P(lng,0); c.beginPath(); c.moveTo(x,0); c.lineTo(x,MAPH); c.stroke(); }
  for(let lat=-90;lat<=90;lat+=30){ const [,y]=P(0,lat); c.beginPath(); c.moveTo(0,y); c.lineTo(MAPW,y); c.stroke(); }
  c.strokeStyle = 'rgba(200,215,180,0.10)'; c.beginPath(); const [,eq]=P(0,0); c.moveTo(0,eq); c.lineTo(MAPW,eq); c.stroke();

  /* 所有陆地合并成一条路径，用于投影与浅水光晕 */
  const world = new Path2D();
  for (const f of features) world.addPath(f.path);

  /* 近岸浅水光晕 */
  c.save();
  c.shadowColor = 'rgba(96,150,150,0.30)';
  c.shadowBlur = 30;
  c.fillStyle = '#0d1d22';
  c.fill(world, 'evenodd');
  c.restore();

  /* 陆地投影：让大陆浮在海面上 */
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.58)';
  c.shadowBlur = 18; c.shadowOffsetX = 5; c.shadowOffsetY = 12;
  c.fillStyle = '#1b1f16';
  c.fill(world, 'evenodd');
  c.restore();

  /* 每国低饱和土色，做出政治地图的细微差异 */
  const PALETTE = [[88,86,56],[70,80,56],[98,88,58],[64,76,54],[92,76,50],[76,86,66],[90,72,46]];
  for (const f of features){
    let h = 0; const n = f.name || '';
    for (let i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i)) >>> 0;
    const p = PALETTE[h % PALETTE.length];
    c.fillStyle = `rgb(${p[0]},${p[1]},${p[2]})`;
    c.fill(f.path, 'evenodd');
  }

  /* 陆地上叠纬度光照与沙漠色带 */
  c.save();
  c.clip(world, 'evenodd');
  const landGrad = c.createLinearGradient(0,0,0,MAPH);
  landGrad.addColorStop(0,'rgba(236,242,214,0.06)');
  landGrad.addColorStop(0.22,'rgba(222,226,196,0.02)');
  landGrad.addColorStop(0.42,'rgba(228,206,150,0.06)');
  landGrad.addColorStop(0.52,'rgba(212,212,182,0.02)');
  landGrad.addColorStop(0.78,'rgba(214,220,196,0.02)');
  landGrad.addColorStop(1,'rgba(0,0,0,0.34)');
  c.fillStyle = landGrad; c.fillRect(0,0,MAPW,MAPH);
  const ridge = c.createLinearGradient(0,0,MAPW,0);
  ridge.addColorStop(0,'rgba(0,0,0,0.10)');
  ridge.addColorStop(0.5,'rgba(255,240,200,0.03)');
  ridge.addColorStop(1,'rgba(0,0,0,0.10)');
  c.fillStyle = ridge; c.fillRect(0,0,MAPW,MAPH);
  c.restore();

  /* 左上暖光，让整张图有作战室的顶灯感 */
  const sun = c.createRadialGradient(MAPW*0.28, MAPH*0.16, 0, MAPW*0.28, MAPH*0.16, MAPW*0.58);
  sun.addColorStop(0,'rgba(255,236,190,0.07)');
  sun.addColorStop(0.55,'rgba(255,236,190,0.025)');
  sun.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = sun; c.fillRect(0,0,MAPW,MAPH);

  /* 南极压暗，避免底部吸引过多注意力 */
  const [,antY] = P(0,-55);
  const ant = c.createLinearGradient(0, antY, 0, MAPH);
  ant.addColorStop(0,'rgba(6,8,5,0)');
  ant.addColorStop(1,'rgba(6,8,5,0.58)');
  c.fillStyle = ant; c.fillRect(0, antY, MAPW, MAPH-antY);

  /* 国界：深色刻线 + 内侧铜色高光，形成雕刻感 */
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = 'rgba(10,12,8,0.94)'; c.lineWidth = 3.0;
  for (const f of features) c.stroke(f.path);
  c.strokeStyle = 'rgba(226,212,168,0.18)'; c.lineWidth = 1.0;
  for (const f of features) c.stroke(f.path);

  /* 纸面颗粒 */
  const noise = document.createElement('canvas');
  noise.width = noise.height = 256;
  const nc = noise.getContext('2d');
  const id = nc.createImageData(256,256);
  for (let i=0;i<id.data.length;i+=4){
    const v = 110 + Math.random()*70;
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=22;
  }
  nc.putImageData(id,0,0);
  c.save();
  c.globalCompositeOperation = 'overlay';
  c.globalAlpha = 0.5;
  c.fillStyle = c.createPattern(noise,'repeat');
  c.fillRect(0,0,MAPW,MAPH);
  c.restore();

  /* 地名注记：低透明度衬线字，像作战地图上的手写标注 */
  const LABELS = [
    ['美国',-100,40],['加拿大',-105,58],['巴西',-52,-10],['俄罗斯',95,62],['中国',104,35],
    ['印度',79,22],['澳大利亚',134,-25],['日本',138,37],['英国',-2,54],['法国',2,47],
    ['德国',10,51],['意大利',12,43],['埃及',30,27],['南非',24,-29],['阿根廷',-64,-35],
    ['墨西哥',-102,24],['土耳其',35,39],['伊朗',54,32],['沙特',45,24],['印尼',117,-2],
    ['尼日利亚',8,9],['巴基斯坦',69,30],['乌克兰',32,49],['波兰',19,52],['瑞典',16,62],
    ['挪威',9,62],['西班牙',-4,40],['阿尔及利亚',2,28],['哈萨克',67,48],['蒙古',103,47],
    ['泰国',101,15],['越南',106,16],['菲律宾',122,12],['韩国',128,36],['朝鲜',127,40]
  ];
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '600 26px Georgia,"Songti SC","SimSun",serif';
  c.shadowColor = 'rgba(0,0,0,0.65)'; c.shadowBlur = 7;
  c.fillStyle = 'rgba(235,224,190,0.48)';
  for (const [name,lng,lat] of LABELS){ const [x,y] = P(lng,lat); c.fillText(name,x,y); }
  c.font = 'italic 22px Georgia,"Songti SC",serif';
  c.fillStyle = 'rgba(200,215,205,0.13)';
  const SEAS = [['太平洋',-150,8],['大西洋',-32,26],['印度洋',76,-22],['北冰洋',10,82],['南冰洋',0,-80]];
  for (const [name,lng,lat] of SEAS){ const [x,y] = P(lng,lat); c.fillText(name,x,y); }
  c.shadowBlur = 0;

  const useBlob = blob => {
    if (!blob){ base.src = cv.toDataURL('image/png'); return; }
    const url = URL.createObjectURL(blob);
    base.onload = ()=>{ URL.revokeObjectURL(url); onBaseReady(); };
    base.src = url;
  };
  if (cv.toBlob) cv.toBlob(useBlob, 'image/png'); else base.src = cv.toDataURL('image/png');
}

/* ================= 画布与相机 ================= */
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const fogCanvas = document.getElementById('fog');
const fctx = fogCanvas.getContext('2d');
let vw=0, vh=0, dpr=1;
const MAX_CANVAS_DPR = 2;   // GPU 合成下按屏幕原生分辨率绘制

const cam = {ox:0, oy:0, z:1};
let bakedZ = 1;           // 底图 CSS 尺寸对应的缩放
let lastLayerW = -1, lastLayerTr = '';

function applyCam(){
  if (!vw || !vh) return;
  const w = Math.round(MAPW*bakedZ), h = Math.round(MAPH*bakedZ);
  const tr = `translate(${cam.ox.toFixed(2)}px,${cam.oy.toFixed(2)}px)`;
  if (w !== lastLayerW){
    lastLayerW = w;
    base.style.width = w+'px'; base.style.height = h+'px';
    hl.style.width = w+'px'; hl.style.height = h+'px';
  }
  if (tr !== lastLayerTr){
    lastLayerTr = tr;
    base.style.transform = tr;
    hl.style.transform = tr;
  }
}
function syncHL(){
  hl.style.display = selId ? '' : 'none';
}
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, MAX_CANVAS_DPR);
  vw = innerWidth; vh = innerHeight;
  if (!vw || !vh) return;
  canvas.width = Math.round(vw*dpr); canvas.height = Math.round(vh*dpr);
  canvas.style.width = vw+'px'; canvas.style.height = vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fogCanvas.width = vw*dpr; fogCanvas.height = vh*dpr;
  fogCanvas.style.width = vw+'px'; fogCanvas.style.height = vh+'px';
  fctx.setTransform(dpr,0,0,dpr,0,0);
  renderVignette();
  if (!inited){ inited = true; fitWorld(); }
  else if (atFit){ fitWorld(); }            // 处于全局视角时，窗口变化后重新铺满
  else {
    cam.z = Math.max(cam.z, minZoom());     // 防止窗口变大后地图缩成一小块
    clampCam();
    bakedZ = cam.z;
    lastLayerW = -1;
    applyCam();
    requestScene();
  }
}
let inited = false;
let atFit = false;
// 最小缩放取“铺满窗口”，避免出现大片黑边与地图矩形硬边
const minZoom = () => Math.max(vw/MAPW, vh/MAPH);
function clampCam(){
  const min = minZoom();
  if (min > 0 && cam.z < min) cam.z = min;
  const w = MAPW*cam.z, h = MAPH*cam.z;
  cam.ox = w<=vw ? (vw-w)/2 : clamp(cam.ox, vw-w, 0);
  cam.oy = h<=vh ? (vh-h)/2 : clamp(cam.oy, vh-h, 0);
}
function fitWorld(){
  const s = Math.max(vw/MAPW, vh/MAPH);
  cam.z = s; cam.ox = (vw-MAPW*s)/2; cam.oy = (vh-MAPH*s)/2;
  atFit = true;
  cancelAnim();
  bakedZ = s;
  lastLayerW = -1;
  applyCam();
  requestScene();
}
const m2s = (x,y) => [x*cam.z+cam.ox, y*cam.z+cam.oy];
const s2m = (x,y) => [(x-cam.ox)/cam.z, (y-cam.oy)/cam.z];

/* ---------- 晕影（DOM 覆盖层，仅 resize 时重绘） ---------- */
const vig = document.getElementById('vigLayer');
function renderVignette(){
  if (!vw || !vh) return;
  vig.width = vw*dpr; vig.height = vh*dpr;
  vig.style.width = vw+'px'; vig.style.height = vh+'px';
  const c = vig.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  const r0 = Math.min(vw,vh)*0.35, r1 = Math.max(vw,vh)*0.72;
  const g = c.createRadialGradient(vw/2,vh/2, Math.max(r0,1), vw/2,vh/2, Math.max(r1,r0+1));
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(2,3,2,0.74)');
  c.fillStyle = g; c.fillRect(0,0,vw,vh);
}

/* ================= 筛选状态 ================= */
let selId = null;
let day = 'all';
const catsOn = new Set(Object.keys(CATS));
const visibleEvents = () => EVENTS.filter(e => (day==='all'||e.d===day) && catsOn.has(e.cat));
const evById = id => EVENTS.find(e=>e.id===id);

/* ================= 飞行相机 ================= */
let flyId = 0;
function cancelAnim(){ flyId++; }
function flyToEvent(ev){
  const pts = ev.locs.map(l=>P(l.lng,l.lat));
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const [x,y] of pts){ x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2, pad=140;
  let z = Math.min((vw-pad*2)/Math.max(x1-x0,1), (vh-pad*2)/Math.max(y1-y0,1), 7);
  z = Math.max(z, minZoom());
  atFit = false;
  const id = ++flyId;
  const from = {ox:cam.ox, oy:cam.oy, z:cam.z};
  const to = {ox:vw/2-cx*z, oy:vh/2-cy*z, z};
  const t0 = performance.now(), dur = 900;
  function step(now){
    if (id !== flyId) return;
    const k = Math.min(1, (now-t0)/dur), e = easeInOutCubic(k);
    cam.ox = lerp(from.ox, to.ox, e);
    cam.oy = lerp(from.oy, to.oy, e);
    cam.z  = lerp(from.z,  to.z,  e);
    clampCam();
    bakedZ = cam.z;
    lastLayerW = -1;
    applyCam();
    drawScene();
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ================= 余烬粒子 ================= */
const embers = [];
for(let i=0;i<70;i++){
  embers.push({x:Math.random(), y:Math.random(),
    s:0.6+Math.random()*1.6, sp:0.000018+Math.random()*0.00005,
    ph:Math.random()*7, a:0.12+Math.random()*0.3});
}

/* ================= 按需渲染（静止时不重绘；交互时随相机重绘） ================= */
let scenePending = false;
function requestScene(){
  if (scenePending) return;
  scenePending = true;
  requestAnimationFrame(()=>{ scenePending = false; drawScene(); });
}
function drawScene(){
  if (!vw || !vh) return;
  draw();
}
function draw(){
  ctx.clearRect(0,0,vw,vh);
  const vis = visibleEvents();
  drawArcs(vis);
  if (hoverCountry && !hoverEv){ drawCountryHover(); }
  drawMarkers(vis);
  drawEmbers();
}

function drawArcs(vis){
  ctx.save();
  const off = 0;
  const zf = clamp(cam.z / minZoom(), 0.4, 1);
  ctx.lineCap = 'round';
  for (const ev of vis){
    if (ev.locs.length < 2) continue;
    const hub = P(ev.locs[0].lng, ev.locs[0].lat);
    const [hx,hy] = m2s(hub[0], hub[1]);
    if (hx<-80||hy<-80||hx>vw+80||hy>vh+80) continue;
    const col = CATS[ev.cat].color;
    const selected = ev.id===selId;
    for (const loc of ev.locs.slice(1,7)){
      const [sx,sy] = m2s(...P(loc.lng,loc.lat));
      const dx=sx-hx, dy=sy-hy, d=Math.hypot(dx,dy);
      if (d<6) continue;
      const bend = Math.min(d*0.22, 90);
      const mx=(hx+sx)/2 - dy/d*bend, my=(hy+sy)/2 + dx/d*bend;
      ctx.beginPath(); ctx.moveTo(hx,hy); ctx.quadraticCurveTo(mx,my,sx,sy);
      ctx.setLineDash([6,10]); ctx.lineDashOffset = off;
      ctx.strokeStyle = 'rgba(4,6,3,0.45)';
      ctx.lineWidth = selected ? 3.6 : 2.4;
      ctx.stroke();
      ctx.strokeStyle = hexA(col, (selected?0.95:0.55)*zf);
      ctx.lineWidth = selected ? 1.8 : 1.0;
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.restore();
}

/* 节点徽章 sprite：光晕 + 黄铜环 + 彩色核心，一次绘制完成 */
const markerSprites = {};
function markerFor(color, selected){
  const key = color + (selected ? 'S' : '');
  if (!markerSprites[key]){
    const S = 96, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d'), cx = S/2;
    const halo = g.createRadialGradient(cx,cx,0,cx,cx,cx);
    halo.addColorStop(0, hexA(color,0.56));
    halo.addColorStop(0.5, hexA(color,0.18));
    halo.addColorStop(1, hexA(color,0));
    g.fillStyle = halo; g.fillRect(0,0,S,S);
    g.beginPath(); g.arc(cx,cx,S*0.28,0,7);
    g.strokeStyle = selected ? 'rgba(255,232,175,0.95)' : 'rgba(224,196,128,0.8)';
    g.lineWidth = S*0.032; g.stroke();
    g.beginPath(); g.arc(cx,cx,S*0.235,0,7);
    g.strokeStyle = 'rgba(8,10,6,0.92)'; g.lineWidth = S*0.045; g.stroke();
    const core = g.createRadialGradient(cx-S*0.07,cx-S*0.08,S*0.02,cx,cx,S*0.23);
    core.addColorStop(0,'#fff8e2');
    core.addColorStop(0.3, color);
    core.addColorStop(1, hexA(color,0.7));
    g.beginPath(); g.arc(cx,cx,S*0.23,0,7); g.fillStyle = core; g.fill();
    g.beginPath(); g.arc(cx-S*0.07,cx-S*0.08,S*0.05,0,7);
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.fill();
    markerSprites[key] = cv;
  }
  return markerSprites[key];
}

function drawMarkers(vis){
  for (const ev of vis){
    const col = CATS[ev.cat].color;
    const selected = ev.id===selId;
    for (const loc of ev.locs){
      const [x,y] = m2s(...P(loc.lng,loc.lat));
      if (x<-60||y<-60||x>vw+60||y>vh+60) continue;
      const r = selected?10.5:6.5;
      const size = r*4.8;
      ctx.drawImage(markerFor(col, selected), x-size/2, y-size/2, size, size);

      const showLabel = loc===ev.locs[0] && (cam.z > minZoom()*2.4 || selected || hoverEv===ev.id);
      if (showLabel){
        const text = loc.n;
        ctx.font = '600 12px Georgia,"Songti SC","SimSun",serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const tw = ctx.measureText(text).width;
        const w = tw + 18, h = 20, ly = y - r - 22;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x-w/2, ly-h/2, w, h, 3);
        else ctx.rect(x-w/2, ly-h/2, w, h);
        ctx.fillStyle = 'rgba(8,10,6,0.82)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(214,178,94,0.32)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#eadfc2';
        ctx.fillText(text, x, ly + 0.5);
      }
    }
  }
}

function drawCountryHover(){
  const f = hoverCountry;
  ctx.save();
  ctx.translate(cam.ox, cam.oy); ctx.scale(cam.z, cam.z);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(6,8,5,0.7)';
  ctx.lineWidth = 4/cam.z;
  ctx.stroke(f.path);
  ctx.strokeStyle = 'rgba(236,205,130,0.95)';
  ctx.lineWidth = 2/cam.z;
  ctx.setLineDash([7,5]);
  ctx.stroke(f.path);
  ctx.setLineDash([]);
  ctx.restore();
}

function drawEmbers(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const e of embers){
    const ex = (e.x + Math.sin(e.ph)*0.01) * vw;
    const ey = e.y * vh;
    const tw = 0.55 + 0.45*Math.sin(e.ph*2);
    ctx.fillStyle = `rgba(255,196,120,${e.a*tw})`;
    ctx.beginPath(); ctx.arc(ex,ey,e.s,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ================= 迷雾开场 ================= */
let fogAnim = null;
function startFog(){
  const t0 = performance.now(), dur = 2200;
  fogAnim = {t0, dur};
  function fogFrame(now){
    if (!fogAnim) return;
    const k = Math.min(1,(now-fogAnim.t0)/fogAnim.dur);
    fctx.clearRect(0,0,vw,vh);
    const cx=vw/2, cy=vh/2;
    const R = Math.max(vw,vh)*0.72;
    const r = Math.max(R * easeInOutCubic(k), 1);
    const alpha = 1 - k;
    fctx.fillStyle = `rgba(3,6,12,${alpha})`;
    fctx.fillRect(0,0,vw,vh);
    fctx.globalCompositeOperation = 'destination-out';
    const r0 = Math.max(r - 260, 0.5);
    const g = fctx.createRadialGradient(cx,cy,r0,cx,cy,Math.max(r, r0 + 1));
    g.addColorStop(0,'rgba(0,0,0,1)');
    g.addColorStop(1,'rgba(0,0,0,0.15)');
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(cx,cy,r,0,7); fctx.fill();
    fctx.globalCompositeOperation = 'source-over';
    if (k>=1){ fogCanvas.style.display='none'; fogAnim=null; return; }
    requestAnimationFrame(fogFrame);
  }
  requestAnimationFrame(fogFrame);
}

/* ================= 输入交互 ================= */
let drag = null;
let lastHoverCheck = 0;

canvas.addEventListener('pointerdown', e=>{
  if (e.button !== 0) return;
  cancelAnim();
  drag = {x:e.clientX, y:e.clientY, moved:false};
  canvas.classList.add('dragging');
  hideTooltip();
  hoverEv = null; hoverCountry = null;
  window.addEventListener('pointermove', onDragMove, {passive:true});
  window.addEventListener('pointerup', onDragEnd);
});
function onDragMove(e){
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
  cam.ox += dx; cam.oy += dy;
  drag.x = e.clientX; drag.y = e.clientY;
  clampCam();
  applyCam();
  requestScene();      // 节点随地图一起移动（GPU 合成下稳定 60fps）
}
function onDragEnd(e){
  if (!drag) return;
  const wasDrag = drag.moved;
  drag = null;
  canvas.classList.remove('dragging');
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  drawScene();
  if (!wasDrag){
    const hit = hitTest(e.clientX, e.clientY);
    if (hit) selectEvent(hit.ev.id, false); else deselect();
  }
}
canvas.addEventListener('pointermove', e=>{
  if (drag) return;
  const t = performance.now();
  if (t - lastHoverCheck < 70) return;
  lastHoverCheck = t;
  const prevEv = hoverEv, prevCountry = hoverCountry;
  hoverEv = null; hoverCountry = null;
  const hit = hitTest(e.clientX, e.clientY);
  if (hit){
    hoverEv = hit.ev;
    canvas.style.cursor = 'pointer';
    showTooltip(e.clientX, e.clientY, hit);
  } else {
    const [mx,my] = s2m(e.clientX, e.clientY);
    hoverCountry = countryAt(mx,my);
    canvas.style.cursor = hoverCountry ? 'pointer' : 'grab';
    if (hoverCountry) showTooltip(e.clientX, e.clientY, {country:hoverCountry.name});
    else hideTooltip();
  }
  if (hoverEv !== prevEv || hoverCountry !== prevCountry) requestScene();
});
canvas.addEventListener('pointerleave', ()=>{
  if (hoverEv || hoverCountry){ hoverEv = null; hoverCountry = null; requestScene(); }
  hideTooltip();
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cancelAnim();
  const factor = Math.exp(-e.deltaY*0.0012);
  const [mx,my] = [e.clientX, e.clientY];
  const [gx,gy] = s2m(mx,my);
  cam.z = clamp(cam.z*factor, minZoom(), 14);
  atFit = cam.z <= minZoom() * 1.001;
  cam.ox = mx - gx*cam.z; cam.oy = my - gy*cam.z;
  clampCam();
  bakedZ = cam.z; lastLayerW = -1;
  applyCam();
  requestScene();
}, {passive:false});
canvas.addEventListener('dblclick', e=>{
  cancelAnim();
  const factor = 1.6;
  const [gx,gy] = s2m(e.clientX, e.clientY);
  cam.z = clamp(cam.z*factor, minZoom(), 14);
  atFit = false;
  cam.ox = e.clientX - gx*cam.z; cam.oy = e.clientY - gy*cam.z;
  clampCam();
  bakedZ = cam.z; lastLayerW = -1;
  applyCam();
  requestScene();
});
window.addEventListener('keydown', e=>{
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const step = 60;
  if (e.key==='+'||e.key==='='){ cam.z = clamp(cam.z*1.25, minZoom(), 14); atFit=false; }
  else if (e.key==='-'){ cam.z = clamp(cam.z/1.25, minZoom(), 14); atFit = cam.z <= minZoom()*1.001; }
  else if (e.key==='ArrowLeft'){ cam.ox += step; }
  else if (e.key==='ArrowRight'){ cam.ox -= step; }
  else if (e.key==='ArrowUp'){ cam.oy += step; }
  else if (e.key==='ArrowDown'){ cam.oy -= step; }
  else if (e.key==='Escape'){ deselect(); return; }
  else return;
  clampCam();
  if (e.key==='+'||e.key==='='||e.key==='-'){ bakedZ = cam.z; lastLayerW = -1; }
  applyCam();
  requestScene();
});

function hitTest(px, py){
  for (const ev of visibleEvents()){
    for (const loc of ev.locs){
      const [x,y] = m2s(...P(loc.lng,loc.lat));
      if (Math.hypot(px-x, py-y) < 16) return {ev, loc};
    }
  }
  return null;
}
function countryAt(mx,my){
  for (const f of features){
    const [x0,y0,x1,y1] = f.bbox;
    if (mx<x0||mx>x1||my<y0||my>y1) continue;
    if (pointInPath(f, mx, my)) return f;
  }
  return null;
}
function pointInPath(f, x, y){
  let inside = false;
  const polys = null; // 使用缓存的点集判断
  return f._pts ? ringTest(f._pts, x, y) : false;
}

function ringTest(rings, x, y){
  for (const pts of rings){
    let inside = false;
    for (let i=0,j=pts.length-1; i<pts.length; j=i++){
      const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
      if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}
let hoverEv = null, hoverCountry = null;

/* ================= 提示框 ================= */
const tooltip = document.getElementById('tooltip');
function showTooltip(x, y, info){
  let html = '';
  if (info.ev){
    html = `<div class="t-title">${info.ev.title}</div>
            <div class="t-sub">${info.loc.n} · ${info.ev.d} · ${CATS[info.ev.cat].name}</div>`;
  } else if (info.country){
    html = `<div class="t-title">${cnName(info.country)}</div>`;
  }
  tooltip.innerHTML = html;
  tooltip.classList.remove('hidden');
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let tx = x+16, ty = y+14;
  if (tx+tw > vw-8) tx = x-tw-16;
  if (ty+th > vh-8) ty = y-th-14;
  tooltip.style.left = tx+'px'; tooltip.style.top = ty+'px';
}
function hideTooltip(){ tooltip.classList.add('hidden'); }

/* ================= UI 构建 ================= */
const $ = id => document.getElementById(id);

function buildChips(){

function buildLegend(){

    const it = document.createElement('div');
    it.className = 'lg-item';
    it.innerHTML = `<span class="dot" style="background:${cat.color};color:${cat.color}"></span><span>${cat.name}</span><span class="cnt">${n}</span>`;
    it.onclick = ()=>{
      if (catsOn.has(key)) catsOn.delete(key); else catsOn.add(key);
      it.classList.toggle('off', !catsOn.has(key));
      rebuildDrawer();
      requestScene();
    };
    lg.appendChild(it);
  }
}

function buildStats(){
  const n = EVENTS.length;
  const cats = Object.keys(CATS).length;
  $('stats').innerHTML = `收录 <b style="color:var(--gold2)">${n}</b> 条要闻<br>${cats} 类事件 · 含独立信源链接`;
}

function rebuildDrawer(){
  const list = $('drList');
  const vis = visibleEvents().slice().sort((a,b)=>a.d.localeCompare(b.d));
  list.innerHTML = '';
  if (!vis.length){
    list.innerHTML = '<div style="padding:20px;font-size:12px;color:var(--muted)">当前筛选下暂无事件</div>';
    return;
  }
  for (const ev of vis){
    const row = document.createElement('div');
    row.className = 'dr-row';
    row.innerHTML = `<span class="dot" style="background:${CATS[ev.cat].color};color:${CATS[ev.cat].color}"></span>
      <div><div class="r-title">${ev.title}</div><div class="r-sub">${ev.d} · ${CATS[ev.cat].name} · ${ev.locs.map(l=>l.n).join(' / ')}</div></div>`;
    row.onclick = ()=>{ selectEvent(ev.id, true); };
    list.appendChild(row);
  }
}

/* ================= 选中事件 ================= */
function selectEvent(id, fly){
  const ev = evById(id);
  if (!ev) return;
  selId = id;
  renderHighlight(ev);
  if (fly){
    day = 'all';
    if (!catsOn.has(ev.cat)){ catsOn.add(ev.cat);
      document.querySelectorAll('.lg-item').forEach((it,i)=>{
        it.classList.toggle('off', !catsOn.has(Object.keys(CATS)[i]));
      });
    }
    refreshChips();
    flyToEvent(ev);
  }
  showPanel(ev);
  requestScene();
  $('drawer').classList.remove('open');
}
function deselect(){
  selId = null;
  renderHighlight(null);
  requestScene();
  $('panel').classList.remove('open');
}

function showPanel(ev){
  const col = CATS[ev.cat].color;
  $('panel').style.setProperty('--catc', col);
  $('pnCat').textContent = CATS[ev.cat].name;
  $('pnDate').textContent = '11月' + ev.d.slice(3).replace(/^0/,'') + '日';
  $('pnTitle').textContent = ev.title;
  $('pnSum').textContent = ev.sum;
  $('pnLocs').innerHTML = ev.locs.map(l=>`<span class="tag loc">${l.n}</span>`).join('');
  $('pnCountries').innerHTML = ev.countries.map(c=>`<span class="tag">${cnName(c)}</span>`).join('');
  const rels = ev.rel || [];
  $('pnRel').innerHTML = rels.length
    ? rels.map(rid=>{
        const r = evById(rid);
        return r ? `<button class="rel-btn" data-id="${rid}">${r.title}（${r.d}）</button>` : '';
      }).join('')
    : '<div style="font-size:12px;color:var(--muted)">无关联事件</div>';
  $('pnLinks').innerHTML = ev.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join('');
  $('panel').classList.add('open');
  $('pnRel').querySelectorAll('.rel-btn').forEach(b=>{
    b.onclick = ()=> selectEvent(+b.dataset.id, true);
  });
}

/* ================= 初始化 ================= */
window.addEventListener('resize', resize);
$('btnList').onclick = ()=> $('drawer').classList.toggle('open');
$('btnReset').onclick = fitWorld;
$('pnClose').onclick = deselect;

resize();
let initRetry = 0;
(function ensureInit(){
  if (!inited && initRetry++ < 90){
    resize();
    requestAnimationFrame(ensureInit);
  }
})();
buildChips();
buildLegend();
buildStats();
rebuildDrawer();

/* ================= 北京时间显示 ================= */
const WEEK_CN = '日一二三四五六';
const pad2 = n => String(n).padStart(2,'0');
function bjNow(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})); }
function updateClock(){
  const d = bjNow();
  $('bjTime').textContent = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())} 周${WEEK_CN[d.getDay()]}`;
}
updateClock();
setInterval(updateClock, 1000);

/* ================= 数据更新中心（自动检测 + 手动补跑） ================= */
const NEWS_LATEST = window.NEWS_DATA.latestDate;
let updating = false;
let viewingDate = fmtDate(bjNow());
let generating = false;
let lastAutoAttempt = 0;
const AUTO_COOLDOWN = 30 * 60 * 1000;   // 自动更新失败后 30 分钟内不重复尝试

function dayDiffFromLatest(){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(NEWS_LATEST || '')) return 0;
  const d = bjNow();
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const latest = new Date(NEWS_LATEST + 'T00:00:00');
  return Math.round((today - latest) / 86400000);
}
function setBanner(msg, state){
  const b = $('updateBanner');
  b.dataset.state = state || '';
  $('ubText').textContent = msg;
  b.classList.remove('hidden');
}
function hideBanner(){ $('updateBanner').classList.add('hidden'); }
$('ubClose').onclick = hideBanner;

function hotReloadData(onNewer, onSame, onError){
  const s = document.createElement('script');
  s.src = 'news-data.js?t=' + Date.now();
  s.onload = ()=>{
    s.remove();
    if (window.NEWS_DATA.latestDate > NEWS_LATEST) onNewer();
    else onSame();
  };
  s.onerror = ()=>{ s.remove(); onError(); };
  document.head.appendChild(s);
}

function runUpdate(manual){
  if (updating) return;
  const diff = dayDiffFromLatest();
  updating = true;
  $('staleBadge').classList.remove('hidden');
  setBanner(manual ? '正在检查数据源是否有新数据…'
                   : `数据截至 ${NEWS_LATEST}，已过期 ${diff} 天，正在自动更新…`, 'working');
  hotReloadData(
    ()=>{
      setBanner('更新完成，正在刷新地图…', 'ok');
      setTimeout(()=>location.reload(), 900);
    },
    ()=>{
      // 数据源未更新：直接由桌面应用调用 workflow 生成当前周
      if (bridge && !generating){
        generating = true;
        updating = false;
        lastAutoAttempt = Date.now();
        window.__pendingWeek = fmtDate(bjNow());
        window.__pendingCurrent = true;
        setBanner('数据源暂无更新，正在调用本地 workflow 检索最新新闻…', 'working');
        bridge.postMessage(JSON.stringify({
          action:'generateWeek',
          week: `${fmtDate(new Date(Date.now() - 7*864e5))}_${fmtDate(bjNow())}`,
          endDate: fmtDate(bjNow())
        }));
      } else {
        updating = false;
        setBanner('数据源未更新，且当前未在桌面应用中运行，无法自动生成。', 'waiting');
      }
    },
    ()=>{
      updating = false;
      setBanner('数据文件加载失败，请检查 news-data.js 是否存在。', 'error');
    }
  );
}
let lastManualAttempt = 0;
$('btnUpdate').onclick = ()=>{
  // 处于历史周视图时，先回到当前数据视图再检查更新
  if (viewingDate !== fmtDate(bjNow())){
    setBanner('已切回当前数据视图，正在检查更新…', 'working');
    setTimeout(()=>location.reload(), 600);
    return;
  }
  // 手动检查允许强制刷新（即使今天已更新），但 10 分钟内不重复触发，避免误点产生费用
  if (Date.now() - lastManualAttempt < 10 * 60 * 1000){
    setBanner('刚刚已检查过；如需再次强制刷新，请 10 分钟后再试。', 'waiting');
    return;
  }
  lastManualAttempt = Date.now();
  runUpdate(true);
};

function checkStale(){
  // 历史周视图不参与过期检测，避免误报覆盖浏览状态
  if (viewingDate !== fmtDate(bjNow())){
    $('staleBadge').classList.add('hidden');
    return;
  }
  const diff = dayDiffFromLatest();
  if (diff >= 1 && !updating && !generating && Date.now() - lastAutoAttempt > AUTO_COOLDOWN) runUpdate(false);
  else if (diff < 1) $('staleBadge').classList.add('hidden');
}
checkStale();
setInterval(checkStale, 60000);

/* ================= 指定日期（历史周数据热切换） ================= */
function fmtDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
/* 已知有数据的周区间（由桌面壳返回），日期落在任一区间即视为有数据 */
let knownWeeks = [];
function weekFor(dateStr){
  // 历史周文件可能是 7 天滚动窗口，区间会重叠；优先选择覆盖最新的一周，保证结果稳定
  let best = null;
  for (const w of knownWeeks){
    if (dateStr < w.start || dateStr > w.end) continue;
    if (!best || w.end > best.end || (w.end === best.end && w.start > best.start)) best = w;
  }
  if (best) return best;
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - 7);
  return {start: fmtDate(d), end: dateStr};
}
function refreshWeeks(){
  if (!bridge) return;
  bridge.postMessage(JSON.stringify({action:'list'}));
}
let loadSeq = 0;
let desiredDate = fmtDate(bjNow());
function loadWeek(dateStr, opts){
  const probe = !!(opts && opts.probe);
  const end = new Date(dateStr + 'T00:00:00');
  if (isNaN(end.getTime())){ if(!probe) setBanner('日期无效。', 'error'); return; }
  const wk = weekFor(dateStr);
  const s = wk.start, e = wk.end;
  // 后台轮询只服务“用户当前想看的周”：用户切走后不再注入脚本，避免抢走视图或覆盖全局数据
  if (probe){
    const dw = weekFor(desiredDate);
    if (dw.start !== s || dw.end !== e) return;
  } else {
    desiredDate = dateStr;
  }
  const seq = ++loadSeq;
  if (!probe) setBanner(`正在加载 ${s} ~ ${e} 的新闻数据…`, 'working');

  const sc = document.createElement('script');
  sc.src = `data/news-${s}_${e}.js?t=` + Date.now();

  const applyEvents = () => {
    const list = (window.NEWS_DATA && Array.isArray(window.NEWS_DATA.events))
      ? window.NEWS_DATA.events : [];
    // 校验加载到的确实是本周数据，避免旧数据被误当成新周
    const ld = (window.NEWS_DATA && window.NEWS_DATA.latestDate) || '';
    if (!list.length || ld < s || ld > e){ missing(); return; }
    // 仅当加载的是待生成周（或没有待生成任务）时才解除生成状态，
    // 否则会把仍在后台运行的生成任务误判为结束，导致并发触发 workflow。
    const pendingWeek = window.__pendingWeek ? weekFor(window.__pendingWeek) : null;
    if (!pendingWeek || (pendingWeek.start === s && pendingWeek.end === e)){
      stopProbe();
      generating = false;
      window.__pendingWeek = null;
      window.__pendingCurrent = false;
    }
    EVENTS.length = 0;
    EVENTS.push(...list);
    viewingDate = e;
    $('btnDate').textContent = e;
    day = 'all';
    selId = null;
    $('panel').classList.remove('open');
    renderHighlight(null);
    buildChips();
    buildLegend();
    buildStats();
    rebuildDrawer();
    fitWorld();
    setBanner(e === fmtDate(bjNow())
      ? `已切换到当前周 ${s} ~ ${e}（${EVENTS.length} 条事件）`
      : `已切换到历史周 ${s} ~ ${e}（${EVENTS.length} 条事件）`, 'ok');
  };

  const missing = () => {
    if (probe) return;                     // 轮询探测阶段静默失败
    if (!bridge){
      setBanner('该周暂无数据，请通过桌面应用启动以自动生成。', 'waiting');
      return;
    }
    if (generating){
      setBanner('已有生成任务在运行，请等它完成后再切换该周。', 'waiting');
      return;
    }
    generating = true;
    window.__pendingWeek = dateStr;
    window.__pendingCurrent = false;
    setBanner(`该周暂无数据，正在自动生成 ${s} ~ ${e}（检索需要一些时间，请稍候）…`, 'working');
    bridge.postMessage(JSON.stringify({action:'generateWeek', week:`${s}_${e}`, endDate:e}));
    startProbe(dateStr);
  };

  // 快速切换日期时，动态 script 的执行顺序不保证；只接受最后一次请求的结果
  sc.onload = () => { sc.remove(); if (seq !== loadSeq) return; applyEvents(); };
  sc.onerror = () => { sc.remove(); if (seq !== loadSeq) return; missing(); };
  document.head.appendChild(sc);
}

/* 生成任务轮询兜底：不依赖桥回调，文件出现即加载（每 10 秒一次，最多 15 分钟，与 workflow 超时对齐） */
let probeTimer = null, probeTries = 0;
function startProbe(dateStr){
  stopProbe();
  probeTries = 0;
  probeTimer = setInterval(()=>{
    if (++probeTries > 90){
      stopProbe();
      generating = false;
      updating = false;
      setBanner('自动生成超时，请检查 workflow/updater.log 或稍后重试。', 'error');
      return;
    }
    loadWeek(dateStr, {probe:true});
  }, 10000);
}
function stopProbe(){
  if (probeTimer){ clearInterval(probeTimer); probeTimer = null; }
}
/* ================= 自定义日历（按是否有数据着色） ================= */
let calMonth = null;
const CAL_WEEK_CN = ['日','一','二','三','四','五','六'];
function hasDataOn(ds){
  return knownWeeks.some(w => ds >= w.start && ds <= w.end);
}
function openCalendar(){
  calMonth = new Date(bjNow().getFullYear(), bjNow().getMonth(), 1);
  refreshWeeks();
  renderCalendar();
  $('calPop').classList.remove('hidden');
}
function closeCalendar(){ $('calPop').classList.add('hidden'); }
function renderCalendar(){
  if (!calMonth) return;
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $('calTitle').textContent = `${y} 年 ${m+1} 月`;
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const lead = first.getDay();
  const today = fmtDate(bjNow());
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let d = 1; d <= daysInMonth; d++){
    const ds = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const future = ds > today;
    const have = hasDataOn(ds);
    const cls = [have ? 'have' : 'none'];
    if (ds === today) cls.push('today');
    if (ds === viewingDate) cls.push('sel');
    cells.push(`<button class="${cls.join(' ')}" data-d="${ds}" ${future ? 'disabled' : ''}>${d}</button>`);
  }
  $('calGrid').innerHTML = cells.join('');
  $('calGrid').querySelectorAll('button[data-d]').forEach(b=>{
    b.onclick = ()=>{
      closeCalendar();
      loadWeek(b.dataset.d);
    };
  });
}
$('btnDate').onclick = ()=>{
  if ($('calPop').classList.contains('hidden')) openCalendar(); else closeCalendar();
};
$('calPrev').onclick = ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderCalendar(); };
$('calNext').onclick = ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderCalendar(); };
document.addEventListener('click', e=>{
  if ($('calPop').classList.contains('hidden')) return;
  if (!$('calPop').contains(e.target) && e.target !== $('btnDate')) closeCalendar();
});
$('btnDate').textContent = fmtDate(bjNow());
$('datePicker').value = fmtDate(bjNow());
$('datePicker').max = fmtDate(bjNow());

/* ================= 本地数据管理（桌面应用 JS 桥接） ================= */
const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.newsManager;
function openManager(){
  if (!bridge){
    setBanner('数据删除需在桌面应用中使用（浏览器无法操作本地文件）。', 'waiting');
    return;
  }
  $('mgrModal').classList.remove('hidden');
  $('mgrList').innerHTML = '<div style="color:var(--muted);font-size:12px">正在读取本地数据…</div>';
  bridge.postMessage(JSON.stringify({action:'list'}));
}
window.onManagerResult = function(out){
  // 自动生成工作流的状态回调
  if (out.type === 'generating') return;
  if (out.type === 'generated'){
    generating = false;
    updating = false;
    stopProbe();
    const pending = window.__pendingWeek;
    const wasCurrent = window.__pendingCurrent;
    window.__pendingWeek = null;
    window.__pendingCurrent = false;
    refreshWeeks();
    // 用户已切走时不要强制跳回生成结果，避免抢走当前浏览视图
    if (wasCurrent && viewingDate === fmtDate(bjNow())){
      setBanner('最新数据已生成，正在刷新地图…', 'ok');
      setTimeout(()=>location.reload(), 800);
      return;
    }
    const tw = pending ? weekFor(pending) : null;
    const dw = weekFor(desiredDate);
    if (tw && tw.start === dw.start && tw.end === dw.end){
      setBanner('该周数据已生成，正在加载…', 'ok');
      loadWeek(pending);
    } else if (tw){
      setBanner(`数据已生成（${tw.start} ~ ${tw.end}），可在日历中选择查看。`, 'ok');
    } else {
      setBanner('后台数据已生成，可在日历中选择查看。', 'ok');
    }
    return;
  }
  if (out.type === 'error'){
    generating = false;
    updating = false;
    stopProbe();
    window.__pendingWeek = null;
    window.__pendingCurrent = false;
    $('staleBadge').classList.toggle('hidden', dayDiffFromLatest() < 1);
    setBanner('自动生成失败：' + (out.error || '未知错误'), 'error');
    return;
  }
  if (!out.ok){
    $('mgrList').innerHTML = `<div style="color:#ffb4b4;font-size:12px">${out.error||'操作失败'}</div>`;
    return;
  }
  if (Array.isArray(out.weeks)){
    knownWeeks = out.weeks.map(w=>{
      const [start, end] = String(w.week).split('_');
      return {start, end};
    });
    if (!$('calPop').classList.contains('hidden')) renderCalendar();
  }
  if (out.removed && out.removed.length){
    setBanner(`已删除：${out.removed.join('、')}（重新打开或切换日期后生效）`, 'ok');
  }
  const weeks = out.weeks || [];
  if (!weeks.length){
    $('mgrList').innerHTML = '<div style="color:var(--muted);font-size:12px">暂无周数据</div>';
    return;
  }
  $('mgrList').innerHTML = weeks.map(w=>`
    <div class="mgr-row">
      <span class="w-name">${w.week.replace('_',' ~ ')}</span>
      <span class="w-meta">${w.events} 条 · ${(w.size/1024).toFixed(1)}KB ${w.hasArchive?'· 含归档':''}</span>
      <button class="mgr-del" data-week="${w.week}">删除</button>
    </div>`).join('');
  $('mgrList').querySelectorAll('.mgr-del').forEach(b=>{
    b.onclick = ()=>{
      const wk = b.dataset.week;
      if (!confirm(`确定删除 ${wk} 的数据文件和归档目录？不可恢复。`)) return;
      bridge.postMessage(JSON.stringify({action:'deleteWeek', week:wk}));
    };
  });
};
$('btnManager').onclick = openManager;
$('mgrClose').onclick = ()=>$('mgrModal').classList.add('hidden');
$('mgrModal').addEventListener('click', e=>{ if(e.target===$('mgrModal')) $('mgrModal').classList.add('hidden'); });

refreshWeeks();   // 初始化时同步各周数据状态，供日历着色
requestScene();

/* ================= 启动画面与渐进加载 ================= */
let splashHidden = false;
function hideSplash(){
  if (splashHidden) return;
  splashHidden = true;
  $('splash').classList.add('hide');
  startFog();
  setTimeout(()=>{ $('splash').style.display='none'; }, 800);
  if (typeof __boot === 'object') __boot.splash = performance.now();
}
function hideSplashSoon(){ setTimeout(hideSplash, 220); }
function notifyShellReady(){
  const b = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.newsManager;
  if (b) b.postMessage(JSON.stringify({action:'ready'}));
}
window.addEventListener('load', ()=>{
  if (typeof __boot === 'object') __boot.load = performance.now();
  // 兜底：底图加载失败时最多等 6 秒，避免启动画面一直不消失
  setTimeout(hideSplash, 6000);
});
